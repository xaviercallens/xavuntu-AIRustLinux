[build]
target = "i686-unknown-linux-gnu"

[target.i686-unknown-linux-gnu]
linker = "rust-lld"
rustflags = [
    "-C", "linker-flavor=ld.lld",
    "-C", "link-arg=-Tlinker.ld",
    "-C", "relocation-model=static"
]

[target.x86_64-unknown-none]
rustflags = [
    "-C", "link-arg=-Tlinker.ld"
]

[target.x86_64-demo_kernel]
rustflags = [
    "-C", "link-arg=-Tlinker.ld"
]
