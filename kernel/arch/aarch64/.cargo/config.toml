# RunuX AArch64 Cross-Compilation Configuration
#
# Usage:
#   cd arch/aarch64
#   cargo build --release
#
# Then boot with QEMU:
#   qemu-system-aarch64 -machine virt -cpu cortex-a72 -nographic -nic none \
#     -kernel target/aarch64-unknown-none/release/runux_aarch64

[build]
target = "aarch64-unknown-none"

[target.aarch64-unknown-none]
runner = "qemu-system-aarch64 -machine virt -cpu cortex-a72 -nographic -nic none -kernel"
rustflags = [
    "-C", "link-arg=-Tarch/aarch64/link.ld",
]
